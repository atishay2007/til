<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 6: Persistent Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Notes</h1>
    <form id="note-form">
      <input id="note-title" type="text" placeholder="Title" required>
      <textarea id="note-body" rows="3" placeholder="Write a quick note..." required></textarea>
      <div class="actions">
        <button type="submit">Save Note</button>
        <button type="button" id="clear-btn">Clear All</button>
      </div>
    </form>
    <ul id="notes-list"></ul>
  </main>
  <script src="notes.js"></script>
</body>
</html>
